<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harness 工作台</title>
<style>
:root{
  --bg:#faf9f7; --panel:#fff; --panel2:#f4f2ee; --line:#e5e1da;
  --fg:#1f1d1a; --dim:#6b665e; --faint:#9a938a;
  --accent:#c2582a; --accent-soft:#f3e3da;
  --ok:#3f7d4e; --warn:#a8791f; --zzz:#8a8378;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#16150f; --panel:#1e1d17; --panel2:#26241d; --line:#332f26;
  --fg:#ece7dc; --dim:#a49d8f; --faint:#736c60;
  --accent:#e0824f; --accent-soft:#3a271c;
  --ok:#7fb98c; --warn:#d8ad5c; --zzz:#6d675c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Segoe UI,sans-serif;}
button{font:inherit;color:inherit;cursor:pointer}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---- 顶栏 ---- */
header{position:sticky;top:0;z-index:20;background:var(--panel);
  border-bottom:1px solid var(--line);padding:12px 18px}
.hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
.root{font-size:12px;color:var(--dim);word-break:break-all}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;
  padding:3px 10px;font-size:12px;color:var(--dim);white-space:nowrap}
.chip b{color:var(--fg);font-weight:650}
#q{flex:1;min-width:220px;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:8px 12px;color:var(--fg);outline:none;font-size:13px}
#q:focus{border-color:var(--accent)}
.tabs{display:flex;gap:4px;background:var(--panel2);padding:3px;border-radius:9px;
  border:1px solid var(--line)}
.tab{border:0;background:none;padding:5px 14px;border-radius:6px;font-size:13px;
  color:var(--dim);font-weight:550}
.tab.on{background:var(--panel);color:var(--fg);box-shadow:var(--shadow)}

/* ---- 主体 ---- */
main{display:grid;grid-template-columns:230px 1fr;gap:16px;padding:16px 18px;
  align-items:start;max-width:1500px;margin:0 auto}
@media(max-width:820px){main{grid-template-columns:1fr}aside{display:none}}
aside{position:sticky;top:74px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px;max-height:calc(100vh - 96px);overflow:auto}
.sec{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.7px;
  padding:8px 8px 5px;font-weight:650}
.nav{display:block;width:100%;text-align:left;border:0;background:none;padding:5px 8px;
  border-radius:7px;font-size:13px;color:var(--dim);display:flex;gap:8px;align-items:center}
.nav:hover{background:var(--panel2)}
.nav.on{background:var(--accent-soft);color:var(--fg);font-weight:600}
.nav .n{margin-left:auto;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.nav .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.f{border:1px solid var(--line);background:var(--panel);border-radius:999px;
  padding:4px 12px;font-size:12px;color:var(--dim)}
.f.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.count{margin-left:auto;font-size:12px;color:var(--faint)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:12px 13px;text-align:left;width:100%;transition:.13s;overflow:hidden}
.card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow)}
.card.sel{border-color:var(--accent);background:var(--accent-soft)}
.ct{font-weight:600;font-size:13.5px;margin-bottom:3px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.cs{font-size:12px;color:var(--dim);line-height:1.45;height:34px;overflow:hidden}
.cm{display:flex;gap:8px;margin-top:8px;font-size:11px;color:var(--faint);
  align-items:center;flex-wrap:wrap}
.dot{width:6px;height:6px;border-radius:99px;flex:none}
.tag{border-radius:5px;padding:1px 6px;font-size:10.5px;font-weight:600;border:1px solid transparent}
.tag.hot{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.tag.zzz{color:var(--zzz);border-color:var(--line)}
.tag.warn{color:var(--warn);border-color:var(--warn)}
.more{grid-column:1/-1;text-align:center;color:var(--faint);font-size:12.5px;padding:16px}

/* ---- 详情抽屉 ---- */
#dr{position:fixed;top:0;right:0;bottom:0;width:min(560px,92vw);background:var(--panel);
  border-left:1px solid var(--line);z-index:40;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .2s;box-shadow:-8px 0 30px rgba(0,0,0,.12)}
#dr.on{transform:none}
.dh{padding:14px 16px;border-bottom:1px solid var(--line)}
.dh h2{font-size:15px;margin:0 0 4px;word-break:break-word}
.dp{font-size:11.5px;color:var(--faint);word-break:break-all}
.acts{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;
  padding:6px 12px;font-size:12.5px;font-weight:550}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.x{margin-left:auto;background:none;border:0;color:var(--faint);font-size:19px;padding:0 6px}
pre{margin:0;padding:14px 16px;overflow:auto;flex:1;font-size:12px;line-height:1.6;
  white-space:pre-wrap;word-break:break-word;color:var(--dim)}
.empty{padding:40px;text-align:center;color:var(--faint);font-size:13px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);
  color:var(--bg);padding:8px 16px;border-radius:8px;font-size:12.5px;opacity:0;
  transition:.2s;pointer-events:none;z-index:60}
#toast.on{opacity:.94}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div>
      <h1>Harness 工作台</h1>
      <div class="root mono" id="root">加载中…</div>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="files">文件</button>
      <button class="tab" data-tab="skills">Skill</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="hrow" style="margin-top:10px">
    <input id="q" placeholder="搜文件名、标题、Skill 名称和描述…  (/ 聚焦)">
    <button class="f" id="reindex">重新索引</button>
  </div>
</header>

<main>
  <aside id="side"></aside>
  <section>
    <div class="bar" id="bar"></div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<div id="dr">
  <div class="dh">
    <div style="display:flex;align-items:flex-start">
      <div style="flex:1;min-width:0">
        <h2 id="dt"></h2>
        <div class="dp mono" id="dpath"></div>
      </div>
      <button class="btn x" onclick="closeDr()">×</button>
    </div>
    <div class="acts">
      <button class="btn" onclick="act('open')">打开</button>
      <button class="btn" onclick="act('reveal')">在访达中显示</button>
      <button class="btn" onclick="copyPath()">复制路径</button>
    </div>
  </div>
  <pre id="dbody"></pre>
</div>
<div id="toast"></div>

<script>
let D=null, tab='files', sel=null, cur=null;
const state={files:{dir:'',kind:'all',sort:'mtime'},skills:{filter:'all',sort:'calls'}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const KB=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB';
function ago(ts){
  if(!ts) return '—';
  // zip 解压出来的文件常带 1980-01-10 这种假时间戳，报成「46 年前」会让人
  // 以为 Skill 很旧，其实只是装的方式不同。如实说时间戳不可信。
  if(ts<631152000) return '时间戳异常';
  const d=(Date.now()/1000-ts)/86400;
  if(d<1) return '今天'; if(d<2) return '昨天';
  if(d<30) return Math.floor(d)+' 天前';
  if(d<365) return Math.floor(d/30)+' 个月前';
  return Math.floor(d/365)+' 年前';
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1600);}

async function load(){
  D=await (await fetch('/api/index')).json();
  $('#root').textContent=D.root;
  const f=D.files, s=D.skills, u=s.usage;
  const used=s.items.filter(x=>x.calls>0).length;
  $('#chips').innerHTML=[
    `<span class="chip"><b>${f.total}</b> 个文件${f.truncated?'+':''}</span>`,
    `<span class="chip"><b>${f.dirs.length}</b> 个目录</span>`,
    `<span class="chip"><b>${KB(f.bytes)}</b></span>`,
    `<span class="chip"><b>${s.total}</b> 个 Skill</span>`,
    u.evidence==='ok'?`<span class="chip">用过 <b>${used}</b> · 没用过 <b>${s.total-used}</b></span>`
                     :`<span class="chip">调用次数未统计</span>`,
  ].join('');
  render();
}

// ---------- 检索 ----------
function matchFiles(){
  const q=$('#q').value.trim().toLowerCase(), st=state.files;
  return D.files.items.filter(i=>{
    if(st.kind!=='all'&&i.kind!==st.kind) return false;
    if(st.dir&&!(i.dir===st.dir||i.dir.startsWith(st.dir+'/'))) return false;
    if(!q) return true;
    return i.name.toLowerCase().includes(q)||i.path.toLowerCase().includes(q)
        ||(i.title||'').toLowerCase().includes(q);
  }).sort((a,b)=> st.sort==='mtime'?b.mtime-a.mtime : st.sort==='bytes'?b.bytes-a.bytes
        : a.path.localeCompare(b.path));
}
function matchSkills(){
  const q=$('#q').value.trim().toLowerCase(), st=state.skills;
  return D.skills.items.filter(i=>{
    const F=st.filter;
    if(F==='used'&&!(i.calls>0)) return false;
    if(F==='never'&&i.calls>0) return false;
    if(F==='nodesc'&&i.desc_len>=30&&i.has_skill_md) return false;
    if(F==='project'&&i.scope!=='project') return false;
    if(!q) return true;
    return i.name.toLowerCase().includes(q)||(i.desc||'').toLowerCase().includes(q);
  }).sort((a,b)=> st.sort==='calls'?(b.calls-a.calls)||a.name.localeCompare(b.name)
        : st.sort==='mtime'?b.mtime-a.mtime : a.name.localeCompare(b.name));
}

// ---------- 渲染 ----------
const KIND={doc:'文档',code:'代码',data:'数据',image:'图片',media:'音视频',conf:'配置',other:'其他'};
const CAP=300;

function render(){
  if(!D) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tab));
  tab==='files'?renderFiles():renderSkills();
}

function renderFiles(){
  const st=state.files, f=D.files;
  // 侧栏：一级目录 + 深层目录按文件数排
  const tops={};
  f.dirs.forEach(d=>{if(!d.path)return;const k=d.path.split('/')[0];
    tops[k]=(tops[k]||0)+d.files;});
  const rootN=(f.dirs.find(d=>d.path==='')||{files:0}).files;
  $('#side').innerHTML='<div class="sec">目录</div>'
    +`<button class="nav ${st.dir===''?'on':''}" data-d=""><span class="t">全部</span><span class="n">${f.total}</span></button>`
    +(rootN?`<button class="nav ${st.dir==='.'?'on':''}" data-d="."><span class="t">（根目录直属）</span><span class="n">${rootN}</span></button>`:'')
    +Object.entries(tops).sort((a,b)=>b[1]-a[1]).map(([k,n])=>
      `<button class="nav ${st.dir===k?'on':''}" data-d="${esc(k)}"><span class="t">${esc(k)}</span><span class="n">${n}</span></button>`).join('');
  $('#side').querySelectorAll('.nav').forEach(b=>b.onclick=()=>{
    st.dir=b.dataset.d==='.'?'␀root':b.dataset.d; render();});

  const kinds=['all',...Object.keys(KIND).filter(k=>f.kinds[k])];
  $('#bar').innerHTML=kinds.map(k=>
      `<button class="f ${st.kind===k?'on':''}" data-k="${k}">${k==='all'?'全部':KIND[k]}${k!=='all'?' '+f.kinds[k]:''}</button>`).join('')
    +'<span style="width:10px"></span>'
    +[['mtime','最近改动'],['bytes','体量'],['name','名称']].map(([v,t])=>
      `<button class="f ${st.sort===v?'on':''}" data-s="${v}">${t}</button>`).join('')
    +'<span class="count" id="cnt"></span>';
  $('#bar').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{st.kind=b.dataset.k;render();});
  $('#bar').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{st.sort=b.dataset.s;render();});

  let list=matchFiles();
  if(st.dir==='␀root') list=D.files.items.filter(i=>i.dir==='');
  $('#cnt').textContent=`${list.length} 项`;
  $('#grid').innerHTML = list.length===0
    ? '<div class="empty">没有匹配的文件</div>'
    : list.slice(0,CAP).map((i,n)=>`
      <button class="card" data-i="${D.files.items.indexOf(i)}" data-t="f">
        <div class="ct">${esc(i.title||i.name)}</div>
        <div class="cs">${esc(i.title?i.name:(i.dir||'根目录'))}</div>
        <div class="cm"><span>${KIND[i.kind]}</span><span>·</span><span>${KB(i.bytes)}</span>
          <span>·</span><span title="${i.mtime?new Date(i.mtime*1000).toLocaleString():'未知'}">${ago(i.mtime)}</span></div>
      </button>`).join('')
      +(list.length>CAP?`<div class="more">另有 ${list.length-CAP} 项未显示，用搜索或筛选缩小范围</div>`:'');
  bindCards();
}

function renderSkills(){
  const st=state.skills, S=D.skills;
  const used=S.items.filter(x=>x.calls>0).length;
  const bad=S.items.filter(x=>!x.has_skill_md||x.desc_len<30).length;
  // 插件市场会贡献十几个路径几乎一样的来源目录，逐条列出来只会刷屏，折成一行
  const plug=S.sources.filter(s=>s.scope==='plugin');
  const rows=S.sources.filter(s=>s.scope!=='plugin')
    .map(s=>[s.path.replace(/^\/Users\/[^/]+/,'~'),s.count,s.path]);
  if(plug.length) rows.push([`插件市场（${plug.length} 个插件）`,
    plug.reduce((a,b)=>a+b.count,0), plug.map(p=>p.path).join('\n')]);
  $('#side').innerHTML='<div class="sec">来源</div>'
    +rows.map(([t,n,tip])=>`<button class="nav" style="cursor:default"><span class="t" title="${esc(tip)}">${esc(t)}</span><span class="n">${n}</span></button>`).join('')
    +(S.items.some(i=>i.dupes&&i.dupes.length)
      ? `<div style="padding:4px 8px 8px;font-size:11.5px;color:var(--faint)">${S.items.reduce((a,i)=>a+(i.dupes||[]).length,0)} 个重名副本已折叠，卡片只显示优先级最高的那份</div>`:'')
    +(S.strays.length?`<div class="sec">skills/ 根下的裸文件</div>`
      +S.strays.map(f=>`<button class="nav" style="cursor:default"><span class="t">${esc(f.name)}</span></button>`).join('')
      +`<div style="padding:6px 8px;font-size:11.5px;color:var(--faint)">这些不是 Skill，不会被加载</div>`:'')
    +(S.usage.evidence==='ok'?`<div class="sec">调用统计</div>
      <div style="padding:4px 8px 10px;font-size:11.5px;color:var(--faint);line-height:1.6">
      读了 ${S.usage.session_files_read} 个会话日志，共 ${S.usage.invocations} 次调用。<br>
      只认 tool_use(name=Skill) 的真实调用，不认被列进系统提示词。</div>`:'');

  $('#bar').innerHTML=[['all','全部 '+S.total],['used','用过 '+used],
      ['never','从未调用 '+(S.total-used)],['nodesc','元信息不全 '+bad],['project','项目级']]
    .map(([v,t])=>`<button class="f ${st.filter===v?'on':''}" data-f="${v}">${t}</button>`).join('')
    +'<span style="width:10px"></span>'
    +[['calls','调用次数'],['mtime','最近更新'],['name','名称']].map(([v,t])=>
      `<button class="f ${st.sort===v?'on':''}" data-s="${v}">${t}</button>`).join('')
    +'<span class="count" id="cnt"></span>';
  $('#bar').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{st.filter=b.dataset.f;render();});
  $('#bar').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{st.sort=b.dataset.s;render();});

  const list=matchSkills();
  $('#cnt').textContent=`${list.length} 项`;
  $('#grid').innerHTML = list.length===0
    ? '<div class="empty">没有匹配的 Skill</div>'
    : list.slice(0,CAP).map(i=>{
      const tags=[];
      if(i.calls>0) tags.push(`<span class="tag hot">${i.calls} 次</span>`);
      else if(D.skills.usage.evidence==='ok') tags.push('<span class="tag zzz">从未调用</span>');
      if(!i.has_skill_md) tags.push('<span class="tag warn">缺 SKILL.md</span>');
      else if(i.desc_len<30) tags.push('<span class="tag warn">描述过短</span>');
      if(i.scope==='project') tags.push('<span class="tag">项目级</span>');
      return `<button class="card" data-i="${D.skills.items.indexOf(i)}" data-t="s">
        <div class="ct">${esc(i.name)}</div>
        <div class="cs">${esc(i.desc||'（没有 description，Agent 不知道什么时候该用它）')}</div>
        <div class="cm">${tags.join('')}<span>${i.files} 文件</span><span>·</span>
          <span>${KB(i.bytes)}</span><span>·</span><span title="${i.mtime?new Date(i.mtime*1000).toLocaleString():'未知'}">${ago(i.mtime)}</span></div>
      </button>`;}).join('')
      +(list.length>CAP?`<div class="more">另有 ${list.length-CAP} 项未显示，用搜索缩小范围</div>`:'');
  bindCards();
}

function bindCards(){
  $('#grid').querySelectorAll('.card').forEach(c=>c.onclick=()=>{
    $('#grid').querySelectorAll('.card').forEach(x=>x.classList.remove('sel'));
    c.classList.add('sel');
    const i=+c.dataset.i;
    open(c.dataset.t==='f'?{...D.files.items[i],_f:1}:{...D.skills.items[i],_f:0});
  });
}

// ---------- 详情 ----------
async function open(it){
  cur=it;
  const isFile=it._f;
  const p = isFile ? it.path : it.path+'/SKILL.md';
  $('#dt').textContent = isFile ? (it.title||it.name) : it.name;
  $('#dpath').textContent = isFile ? D.root+'/'+it.path : it.path;
  cur._abs = isFile ? null : it.path;
  $('#dr').classList.add('on');
  $('#dbody').textContent='读取中…';

  // 图片直接显示。库里图片占比不低，只报「二进制文件」等于看不见。
  if(isFile && it.kind==='image'){
    $('#dbody').innerHTML=`<img src="/api/raw?path=${encodeURIComponent(it.path)}" alt=""
      style="max-width:100%;border-radius:8px;background:var(--panel2)"
      onerror="this.replaceWith(Object.assign(document.createElement('div'),
        {textContent:'这张图预览不了（可能超过 12 MB），点「打开」用系统程序看。'}))">
      <div style="margin-top:10px;font-size:11.5px;color:var(--faint)">${KB(it.bytes)} · ${esc(it.ext)}</div>`;
    return;
  }
  try{
    const r=await (await fetch('/api/file?path='+encodeURIComponent(p))).json();
    if(r.error) $('#dbody').textContent='读不了：'+r.error;
    else if(r.binary) $('#dbody').textContent='二进制文件（'+KB(r.bytes)+'），点「打开」用系统程序看。';
    else $('#dbody').textContent=r.text+(r.truncated?'\n\n… 内容过长，已截断':'');
  }catch(e){ $('#dbody').textContent='读不了：'+e; }
}
function closeDr(){$('#dr').classList.remove('on');}
function target(){return cur? (cur._f?cur.path:cur.path) : null;}
async function act(mode){
  if(!cur) return;
  const r=await (await fetch('/api/open',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({path:target(),mode})})).json();
  toast(r.error?('失败：'+r.error):(mode==='reveal'?'已在访达中定位':'已打开'));
}
function copyPath(){
  const p=cur._f?D.root+'/'+cur.path:cur.path;
  navigator.clipboard.writeText(p).then(()=>toast('路径已复制'),()=>toast('复制失败'));
}

// ---------- 交互 ----------
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{tab=t.dataset.tab;render();});
let deb; $('#q').oninput=()=>{clearTimeout(deb);deb=setTimeout(render,140);};
$('#reindex').onclick=async()=>{
  $('#reindex').textContent='索引中…';
  await fetch('/api/reindex'); await load();
  $('#reindex').textContent='重新索引'; toast('索引已更新');
};
addEventListener('keydown',e=>{
  if(e.key==='Escape') closeDr();
  if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus();}
});
load();
</script>
